[project]
name = "call-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "pynput>=1.8.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_generator"]

[tool.ruff.lint]
ignore = ["DTZ005"]
